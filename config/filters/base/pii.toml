# config/filters/base/pii.toml: tier-0 base list, category "pii" (ARCHITECTURE.md §7).
# Extra link and contact patterns on top of the built-in PII regexes (URLs, e-mails,
# @handles, Thai phone numbers, 13-digit national IDs). Chat input: the span is MASKed
# ("[ลิงก์]"). Speech, tool, memory: BLOCK. These rules run on the display text,
# case-insensitively, so only substring and regex are allowed. Keep every regex linear:
# bounded repeats ({0,3}, {2,63}) instead of adjacent \s* / unbounded runs.
# Format: see README.md in this folder.
category = "pii"

regex = [
  # invite links, also written with spaces or "dot"
  'discord(?:app)?\s{0,3}(?:\.|dot|ดอท)?\s{0,3}(?:gg|com\s{0,3}/\s{0,3}invite)\s{0,3}/\s{0,3}[a-z0-9-]+',
  '(?:dsc\.gg|lin\.ee|t\.me|line\.me)\s{0,3}/\s{0,3}[^\s]+',
  # obfuscated domains: "example [.] com", "example dot com", "example ดอท com"
  '(?<![a-z0-9-])[a-z0-9-]{2,63}\s{0,3}(?:\[\s?\.\s?\]|\(\s?\.\s?\)|\s{1,3}dot\s{1,3}|ดอท)\s{0,3}(?:com|net|org|gg|me|ly|co|io|xyz|bet|vip|th)(?![a-z])',
  # LINE contact IDs
  '(?:ไอดีไลน์|ไลน์ไอดี|แอดไลน์|line\s?id)\s{0,3}[:：]?\s{0,3}@?[a-z0-9._-]{3,40}',
]
