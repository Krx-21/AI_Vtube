# models/manifest.toml: pinned external models and binaries (ARCHITECTURE.md §9).
# Read by `aivtube models {pull,verify}`, `aivtube setup` and the launcher preflight (§2.6).
#
# One table per artifact, [models.<name>], with:
#   url          direct HTTPS download (pinned to a tag or commit, never a moving branch)
#   sha256       hex digest; "" = not pinned yet (verify reports "unpinned" instead of failing)
#   size         exact size in bytes; 0 = unknown
#   licence      SPDX id or a short licence name
#   required_by  config keys / components that need the file
#   dest         destination relative to the repository root
# Optional keys:
#   variant      mutually exclusive choice (setup picks cuda-13.4 for driver >= R580, else 12.4)
#   unpack       "zip" = extract into `dest` (a directory), keeping the archive's layout
#   optional     true = not downloaded by default
#   notes        free text
schema_version = 1

# --- VAD -----------------------------------------------------------------------------------

[models.silero_vad]
url = "https://raw.githubusercontent.com/snakers4/silero-vad/v6.2.3/src/silero_vad/data/silero_vad.onnx"
sha256 = "1a153a22f4509e292a94e67d6f9b85e8deb25b4988682b7e174c65279d8788e3"
size = 2327524
licence = "MIT"
required_by = ["vad.model", "voice.vad"]
dest = "models/vad/silero_vad.onnx"
notes = "Silero VAD v6.2.3; the same file is committed as tests/fixtures/silero_vad.onnx."

# --- STT: Typhoon ASR Realtime, our own int8 ONNX export (CC-BY-4.0, attribution in NOTICE) ---
# Published by .github/workflows/models-export.yml as assets of the GitHub Release
# `models-typhoon-rt-v1`. ONNX export is not byte-reproducible across environments, so the
# encoder/decoder/joiner digests are pinned from that release's SHA256SUMS after it is
# published (about 131 MB + 4.6 MB + 2.1 MB). tokens.txt is deterministic.

[models.typhoon_rt_encoder]
url = "https://github.com/Krx-21/AI_Vtube/releases/download/models-typhoon-rt-v1/encoder.int8.onnx"
sha256 = ""
size = 0
licence = "CC-BY-4.0"
required_by = ["stt.backends.typhoon_rt"]
dest = "models/stt/typhoon-asr-rt-int8/encoder.int8.onnx"

